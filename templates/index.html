<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube to Mp4 Converter</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <h1>Youtube To Mp3/MP4</h1>
    <form action="/download" method="POST">
        <input type="text" name="url" placeholder="Insert Youtube URL here" id="urlInput" required>
        <button type="submit" name="file_format" value="mp4">Download Mp4</button>
        <button type="submit" name="file_format" value="mp3">Download Mp3</button>
        <input type="checkbox" name="remove_category" value="sponsor">
        <label>Remove Sponsors</label>
        <input type="checkbox" name="remove_category" value="intro">
        <label>Remove Intro</label>
        <input type="checkbox" name="remove_category" value="outro">
        <label>Remove Outro</label>
        <input type="checkbox" name="remove_category" value="selfpromo">
        <label>Remove Self Promotion</label>
        <input type="checkbox" name="remove_category" value="preview">
        <label>Remove Preview</label>
        <input type="checkbox" name="remove_category" value="filler">
        <label>Remove Filler</label>
        <input type="checkbox" name="remove_category" value="interaction">
        <label>Remove Interaction</label>
        <input type="checkbox" name="remove_category" value="hook">
        <label>Remove Hook</label>
    </form>

    <script src="static/index.js"></script>

</body>

</html>
